name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
    
    - name: Lint with flake8 (if available)
      run: |
        if pip show flake8 >/dev/null 2>&1; then
          flake8 nage/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 nage/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        else
          echo "flake8 not installed, skipping linting"
        fi
    
    - name: Run deterministic test suite
      run: pytest -q

    - name: Smoke-test module entry point
      run: python -m nage --version

  build-test:
    name: Test installer package build on ${{ matrix.platform }}-${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            package_format: "deb"
            installer_ext: ".deb"
          - os: windows-latest
            platform: windows
            arch: x64
            package_format: "msi"
            installer_ext: ".msi"
          - os: macos-15
            platform: macos
            arch: arm64
            package_format: "dmg"
            installer_ext: ".dmg"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 使用稳定版本进行构建测试
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install timeout command (macOS)
      if: matrix.platform == 'macos'
      run: |
        brew install coreutils
    
    - name: Install WiX Toolset (Windows)
      if: matrix.platform == 'windows'
      run: |
        choco install wixtoolset -y
        echo "C:\\Program Files (x86)\\WiX Toolset v3.11\\bin" >> $GITHUB_PATH
    
    - name: Install deb build tools (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev
    
    - name: Install dependencies with build extras
      run: |
        uv sync --extra build --extra test

    - name: Resolve canonical package versions
      shell: bash
      run: |
        echo "PACKAGE_VERSION=$(python scripts/package_version.py --format pep440)" >> "$GITHUB_ENV"
        echo "INSTALLER_NUMERIC_VERSION=$(python scripts/package_version.py --format msi)" >> "$GITHUB_ENV"

    - name: Run cross-platform core tests
      run: uv run pytest -q
    
    - name: Create PyInstaller spec file
      shell: bash
      run: |
        if [ "${{ matrix.arch }}" = "arm64" ]; then
          # ARM64 spec file
          cat > nage.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        
        from PyInstaller.utils.hooks import copy_metadata

        block_cipher = None
        
        a = Analysis(
            ['nage/__main__.py'],
            pathex=[],
            binaries=[],
            datas=copy_metadata('nage') + [('LICENSE.txt', '.')],
            hiddenimports=['click', 'openai', 'pathspec', 'psutil', 'pyperclip', 'send2trash', 'nage.app', 'nage.cli'],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='nage',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=False,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=True,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch='arm64',
            codesign_identity=None,
            entitlements_file=None,
        )
        EOF
        else
          # x64 spec file (Linux, Windows, macOS Intel)
          cat > nage.spec << 'EOF'
        # -*- mode: python ; coding: utf-8 -*-
        
        from PyInstaller.utils.hooks import copy_metadata

        block_cipher = None
        
        a = Analysis(
            ['nage/__main__.py'],
            pathex=[],
            binaries=[],
            datas=copy_metadata('nage') + [('LICENSE.txt', '.')],
            hiddenimports=['click', 'openai', 'pathspec', 'psutil', 'pyperclip', 'send2trash', 'nage.app', 'nage.cli'],
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )
        
        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)
        
        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='nage',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=False,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=True,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch='x86_64',
            codesign_identity=None,
            entitlements_file=None,
        )
        EOF
        fi
    
    - name: Test build executable with PyInstaller
      timeout-minutes: 10
      shell: bash
      run: |
        uv run --extra build pyinstaller --clean nage.spec

    - name: Test Linux .deb package creation
      if: matrix.platform == 'linux'
      run: |
        # 创建 Debian 包结构
        mkdir -p nage_${PACKAGE_VERSION}_amd64/DEBIAN
        mkdir -p nage_${PACKAGE_VERSION}_amd64/usr/bin
        mkdir -p nage_${PACKAGE_VERSION}_amd64/usr/share/applications
        mkdir -p nage_${PACKAGE_VERSION}_amd64/usr/share/doc/nage
        
        # 复制可执行文件
        cp dist/nage nage_${PACKAGE_VERSION}_amd64/usr/bin/
        chmod +x nage_${PACKAGE_VERSION}_amd64/usr/bin/nage
        cp LICENSE.txt nage_${PACKAGE_VERSION}_amd64/usr/share/doc/nage/copyright
        
        # 创建控制文件
        cat > nage_${PACKAGE_VERSION}_amd64/DEBIAN/control << EOF
        Package: nage
        Version: $PACKAGE_VERSION
        Section: utils
        Priority: optional
        Architecture: amd64
        Maintainer: 0x3st
        Description: Safe one-shot natural-language terminal assistant
         A typed, policy-controlled terminal assistant.
        EOF
        
        # 创建 .desktop 文件
        cat > nage_${PACKAGE_VERSION}_amd64/usr/share/applications/nage.desktop << EOF
        [Desktop Entry]
        Name=Nage
        Comment=Safe natural-language terminal assistant
        Exec=/usr/bin/nage
        Terminal=true
        Type=Application
        Categories=Utility;
        EOF
        
        # 构建 .deb 包
        dpkg-deb --build nage_${PACKAGE_VERSION}_amd64
        mv nage_${PACKAGE_VERSION}_amd64.deb nage-test-${{ matrix.platform }}-${{ matrix.arch }}.deb
        echo "✅ .deb package created successfully"

    - name: Test Windows MSI installer creation
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        # 创建 WiX 源文件 - 简化版本
        cat > nage.wxs << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
          <Product Id="*" Name="Nage" Language="1033" Version="${INSTALLER_NUMERIC_VERSION}" Manufacturer="0x3st" UpgradeCode="12345678-1234-1234-1234-123456789012">
            <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
            <MajorUpgrade DowngradeErrorMessage="A newer version of [ProductName] is already installed." />
            <MediaTemplate EmbedCab="yes" />
            
            <Feature Id="ProductFeature" Title="Nage" Level="1">
              <ComponentGroupRef Id="ProductComponents" />
            </Feature>
            
            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="Nage" />
              </Directory>
            </Directory>
            
            <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
              <Component Id="NageExecutable" Guid="4C3F2B4D-0E3B-4F5E-9A7D-2A9D2B4B1E10">
                <File Id="NageExecutableFile" Source="dist/nage.exe" KeyPath="yes"/>
                <Environment Id="AddToPath" Name="PATH" Value="[INSTALLFOLDER]" Action="set" Part="last" System="yes" />
              </Component>
              <Component Id="NageLicense" Guid="C9E8F7A6-5B4C-4938-8D2E-1F0A9B8C7D60">
                <File Id="NageLicenseFile" Source="LICENSE.txt" KeyPath="yes"/>
              </Component>
            </ComponentGroup>
          </Product>
        </Wix>
        EOF
        
        # 编译 MSI
        candle.exe nage.wxs
        light.exe -sw1076 -o nage-test-${{ matrix.platform }}-${{ matrix.arch }}.msi nage.wixobj
        echo "✅ MSI installer created successfully"

    - name: Test macOS DMG package creation
      if: matrix.platform == 'macos'
      run: |
        # 创建应用程序包结构
        mkdir -p Nage.app/Contents/MacOS
        mkdir -p Nage.app/Contents/Resources
        
        # 复制可执行文件
        cp dist/nage Nage.app/Contents/MacOS/
        chmod +x Nage.app/Contents/MacOS/nage
        cp LICENSE.txt Nage.app/Contents/Resources/LICENSE.txt
        
        # 创建 Info.plist
        cat > Nage.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>nage</string>
            <key>CFBundleIdentifier</key>
            <string>com.0x3st.nage</string>
            <key>CFBundleName</key>
            <string>Nage</string>
            <key>CFBundleVersion</key>
            <string>$PACKAGE_VERSION</string>
            <key>LSUIElement</key>
            <true/>
        </dict>
        </plist>
        EOF
        
        # 创建 DMG
        hdiutil create -volname "Nage" -srcfolder Nage.app -ov -format UDZO nage-test-${{ matrix.platform }}-${{ matrix.arch }}.dmg
        echo "✅ DMG package created successfully"
    
    - name: Test executable (Linux/macOS)
      if: matrix.platform != 'windows'
      shell: bash
      run: |
        chmod +x ./dist/nage
        ./dist/nage --version | grep -F "$PACKAGE_VERSION"

    - name: Test executable (Windows)
      if: matrix.platform == 'windows'
      shell: bash
      run: |
        ./dist/nage.exe --version | grep -F "$PACKAGE_VERSION"
    
    - name: Upload test installer package
      uses: actions/upload-artifact@v4
      with:
        name: test-nage-${{ matrix.platform }}-${{ matrix.arch }}-installer
        path: nage-test-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.installer_ext }}
        retention-days: 1
